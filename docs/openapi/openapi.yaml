        \ execution returns HTTP 200 with ProfileResponse. Access: Authenticated via\
        \ SecurityConfig matcher /api/v1/users/me/avatar; @PreAuthorize(\"isAuthenticated()\"\
        ). Consumes MediaType.MULTIPART_FORM_DATA_VALUE."
      operationId: userUploadAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Uploaded binary file.
              required:
              - file
      responses:
