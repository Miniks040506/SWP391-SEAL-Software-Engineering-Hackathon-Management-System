openapi: 3.1.0
info:
  title: SEAL Hackathon API
  description: "REST API for hackathon access, teams, submissions, grading, results,\
    \ notifications, exports, and AI assistance."
  contact:
    name: SEAL Engineering Team
  license:
    name: Project license
  version: v1
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Audit Logs
  description: Query append-only audit activity and supported action types.
- name: Awards
  description: "Award prizes, clear awards, and derive winners from ranking."
- name: Event Exports
  description: "Create event ranking, score, and team-list exports."
- name: Exports
  description: "Create, inspect, download, retry, and delete export jobs."
- name: Event Competition
  description: Participant competition view for an event.
- name: Notifications
  description: "Notification inbox, dispatch, recipient resolution, and email testing."
- name: Submissions
  description: "Submission drafts, deliverables, files, metadata, and score visibility."
- name: Team Join Requests
  description: Participant join requests and leader decisions.
- name: Teams
  description: "Team formation, invitations, join requests, and registration"
- name: Authentication
  description: "Registration, login, verification, and password recovery"
- name: Reminders
  description: Manual and generated event deadline reminders.
- name: Tracks
  description: Competition tracks and mentor assignments
- name: Ranking Queries
  description: Filtered rankings and team ranking history.
- name: Mentors
  description: "Mentor tracks, team progress, submissions, and feedback."
- name: Criteria
  description: Scoring criteria and event overrides
- name: System
  description: System configuration and health information.
- name: Tracks
  description: "Track configuration, mentor assignment, availability, and registration."
- name: AI Administration
  description: "Manage AI knowledge, embeddings, and safety logs."
- name: Team Invitations
  description: Invitation inbox and token-based invitation actions.
- name: Authentication
  description: "Registration, verification, login, token, logout, and password recovery."
- name: Disqualifications
  description: "Disqualification, appeal, overturn, and active-case lookup."
- name: Results
  description: "Ranking, advancement, disqualification, prizes, and publication"
- name: Teams
  description: "Team lifecycle, membership, invitations, join codes, and advancement\
    \ status."
- name: Rounds
  description: "Round lifecycle, locking, and advancement"
- name: Coordinator Grading
  description: Coordinator grading progress and score-sheet reopening.
- name: Grading
  description: "Judge assignment, scoring, calibration, and progress"
- name: Audit
  description: Append-only audit history
- name: Calibration
  description: "Calibration rounds, benchmark scoring, and score distributions."
- name: Announcements
  description: Manage and publish event announcements.
- name: Exports
  description: "Export job creation, status, and downloads"
- name: AI Assistant
  description: "Assistant chat, RAG knowledge, and safety administration"
- name: Export Jobs
  description: Compatibility endpoints for export status and downloads.
- name: Users
  description: "User administration, approval, guest judges, and profile operations."
- name: Users
  description: Profiles and user administration
- name: Rounds
  description: "Round lifecycle, advance rules, assignments, locks, and progress."
- name: System
  description: System configuration and health
- name: Grading
  description: "Judge score-sheet retrieval, draft save, and final submission."
- name: Coordinator Teams
  description: "Coordinator team search, review, and registration decisions."
- name: Forming Teams
  description: Discover teams currently accepting participants.
- name: Results and Rankings
  description: "Ranking calculation, leaderboards, advancement, and result publication."
- name: Notifications
  description: "Announcements, notifications, reminders, and email delivery"
- name: Events
  description: Event lifecycle and public discovery
- name: Prizes
  description: Prize CRUD and event prize lookup.
- name: Judges
  description: Judge assignments and assigned-submission queues.
- name: AI Assistant
  description: Role-aware bilingual assistant conversations and RAG responses.
- name: Submissions
  description: "Deliverables, links, files, and repository metadata"
- name: Scoring Criteria
  description: Reusable criteria and event-specific criteria configuration.
- name: Events
  description: "Event lifecycle, public discovery, result publication, and RBL entry\
    \ points."
paths:
  /api/v1/system/config:
    get:
      tags:
      - System
      summary: Get System Config
      description: "Get System Config through GET /api/v1/system/config. Successful\
        \ execution returns HTTP 200 with List<SystemConfigResponse>. Access: SecurityConfig\
        \ role ADMIN via matcher /api/v1/system/config/**; @PreAuthorize(\"hasRole('ADMIN')\"\
        )."
      operationId: systemGetSystemConfig
      parameters:
      - name: category
        in: query
        description: Category value. (optional)
        required: false
        schema:
          type: string
      - name: includeSecrets
        in: query
        description: "Include Secrets value. (default: false, optional)"
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Get system config completed successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemConfigResponse"
        "400":
          description: "Request syntax, parameter conversion, or validation failed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Authentication is required or the access token is invalid.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: The authenticated user does not satisfy the required authorization
            policy.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: An unexpected server error occurred.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - System
      summary: Update System Config
      description: "Update System Config through PUT /api/v1/system/config. Successful\
        \ execution returns HTTP 200 with List<SystemConfigResponse>. Access: SecurityConfig\
        \ role ADMIN via matcher /api/v1/system/config/**; @PreAuthorize(\"hasRole('ADMIN')\"\
        ). Requires an UpdateSystemConfigRequest request body validated with Jakarta\
        \ Bean Validation."
      operationId: systemUpdateSystemConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSystemConfigRequest"
        required: true
      responses:
        "200":
          description: Update system config completed successfully.
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemConfigResponse"
        "400":
          description: "Request syntax, parameter conversion, or validation failed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Authentication is required or the access token is invalid.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: The authenticated user does not satisfy the required authorization
            policy.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The operation conflicts with the current resource or workflow
            state.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: An unexpected server error occurred.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/users:
    get:
      tags:
      - Users
      summary: Get Users
      description: "Get Users through GET /api/v1/users. Successful execution returns\
        \ HTTP 200 with PageResponse<UserSummaryResponse>. Access: SecurityConfig\
        \ roles ADMIN, COORDINATOR via matcher /api/v1/users; @PreAuthorize(\"hasAnyRole('ADMIN',\
        \ 'COORDINATOR')\")."
      operationId: userGetUsers
      parameters:
      - name: role
        in: query
        description: Role value. (optional)
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Optional status filter. (optional)
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: Optional free-text search term. (optional)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "Zero-based result page index. (default: 0, optional)"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: "Maximum number of items returned in one page. (default: 20,\
          \ optional)"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Get users completed successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Request syntax, parameter conversion, or validation failed."
