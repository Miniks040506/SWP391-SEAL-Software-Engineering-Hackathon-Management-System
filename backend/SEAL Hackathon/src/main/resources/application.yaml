# src/main/resources/application.yml

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: SEAL HACKATHON

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/seal_hackathon
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  #    url: jdbc:sqlserver://localhost:1433;databaseName=SealHackathonSystem;encrypt=true;trustServerCertificate=true
  #    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  #    username: sa
  #    password: 12345

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  #        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:}
  header: ${JWT_HEADER:}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email-verification-expiration-minutes: 30
  password-reset-expiration-minutes: 15
  oauth2:
    success-path: /oauth/callback
    failure-path: /login

github:
  api-base-url: https://api.github.com
  token: ${GITHUB_TOKEN:}

#gitlab:
#  api-base-url: https://gitlab.com/api/v4
#  token: ${GITLAB_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  avatar-folder: seal/users/avatars
  avatar-max-size-mb: 3