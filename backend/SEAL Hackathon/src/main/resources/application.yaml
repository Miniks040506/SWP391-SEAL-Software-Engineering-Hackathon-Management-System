# src/main/resources/application.yml

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: SEAL HACKATHON

  profiles:
    active: dev

  datasource:
#    url: jdbc:postgresql://localhost:5432/seal_hackathon
#    username: ${DB_USERNAME:postgres}
#    password: ${DB_PASSWORD:123456}
#    driver-class-name: org.postgresql.Driver
    url: jdbc:jdbc:sqlserver://localhost:1433;databaseName=HSF_JPA_DB;encrypt=true;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: 12345

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:gfghsgkjhfdshjtkusghjfhkfgsdjthsjrgshgrshghgdfhatrhr}
  header: ${JWT_HEADER:Authorization}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email-verification-expiration-minutes: 30
  password-reset-expiration-minutes: 15

github:
  api-base-url: https://api.github.com
  token: ${GITHUB_TOKEN:}

gitlab:
  api-base-url: https://gitlab.com/api/v4
  token: ${GITLAB_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG