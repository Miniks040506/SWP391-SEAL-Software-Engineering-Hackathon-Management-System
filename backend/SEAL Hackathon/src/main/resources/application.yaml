# src/main/resources/application.yml

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: SEAL HACKATHON

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/seal_hackathon
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  #    url: jdbc:sqlserver://localhost:1433;databaseName=SealHackathonSystem;encrypt=true;trustServerCertificate=true
  #    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  #    username: sa
  #    password: 12345

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  #        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:30MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:30MB}

jwt:
  secret: ${JWT_SECRET:}
  header: ${JWT_HEADER:}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  email-verification-expiration-minutes: 1440
  password-reset-expiration-minutes: 15
  password-history:
    limit: 5
  guest-judge:
    deactivation-delay-hours: 24
    deactivation-initial-delay-ms: 60000
    deactivation-delay-ms: 3600000
  unverified-account:
    retention-days: 7
    anonymization-initial-delay-ms: 60000
    anonymization-delay-ms: 3600000
  login:
    max-failed-attempts: 5
    lock-duration-minutes: 15
  oauth2:
    success-path: /oauth/callback
    failure-path: /login
  integrations:
    credential-encryption-key: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:}
    cookie-secure: ${PROVIDER_OAUTH_COOKIE_SECURE:false}
    google-drive:
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:}
      picker-api-key: ${GOOGLE_DRIVE_PICKER_API_KEY:}
      app-id: ${GOOGLE_DRIVE_APP_ID:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      api-base-url: https://www.googleapis.com
      scopes: openid,email,https://www.googleapis.com/auth/drive.file
  submission:
    storage:
      provider: ${SUBMISSION_STORAGE_PROVIDER:AWS_S3}
    upload:
      max-size-mb: ${SUBMISSION_UPLOAD_MAX_SIZE_MB:25}
      max-files: ${SUBMISSION_UPLOAD_MAX_FILES:10}
      allowed-content-types: ${SUBMISSION_UPLOAD_ALLOWED_CONTENT_TYPES:application/pdf,application/zip,application/x-zip-compressed,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,video/mp4,image/png,image/jpeg,image/png,text/plain}
      allowed-extensions: ${SUBMISSION_UPLOAD_ALLOWED_EXTENSIONS:.pdf,.zip,.ppt,.pptx,.mp4,.png,.jpg,.jpeg,.txt}
    providers:
      local-file:
        enabled: ${SUBMISSION_LOCAL_FILE_ENABLED:false}
        unavailable-message: ${SUBMISSION_LOCAL_FILE_UNAVAILABLE_MESSAGE:Local file upload is disabled. Configure object storage and set SUBMISSION_LOCAL_FILE_ENABLED=true.}
      google-drive:
        enabled: ${SUBMISSION_GOOGLE_DRIVE_ENABLED:false}
        unavailable-message: ${SUBMISSION_GOOGLE_DRIVE_UNAVAILABLE_MESSAGE:Google Drive is not configured. Ask an administrator to configure the Drive OAuth application.}
      github:
        enabled: ${SUBMISSION_GITHUB_ENABLED:false}
        unavailable-message: ${SUBMISSION_GITHUB_UNAVAILABLE_MESSAGE:GitHub repository connection is not configured. Ask an administrator to configure the GitHub OAuth application.}
    repo-metadata:
      enabled: ${REPO_METADATA_ENABLED:true}

github:
  api-base-url: https://api.github.com
  token: ${GITHUB_TOKEN:}

gitlab:
  api-base-url: ${GITLAB_API_BASE_URL:https://gitlab.com/api/v4}
  token: ${GITLAB_TOKEN:}

aws:
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

seal:
  ai:
    # Runtime feature flag. If false, /assistant endpoints return fallback/disabled behavior.
    enabled: ${SEAL_AI_ENABLED:true}
    # RULE_BASED keeps local fallback. OPENAI, DEEPSEEK and OPENAI_COMPATIBLE call a real model.
    provider: ${SEAL_AI_PROVIDER:RULE_BASED}
    chat:
      base-url: ${SEAL_AI_CHAT_BASE_URL:https://api.openai.com/v1}
      api-key: ${SEAL_AI_CHAT_API_KEY:}
      model: ${SEAL_AI_CHAT_MODEL:gpt-4o-mini}
      temperature: ${SEAL_AI_CHAT_TEMPERATURE:0.2}
      max-tokens: ${SEAL_AI_CHAT_MAX_TOKENS:1200}
      timeout-seconds: ${SEAL_AI_CHAT_TIMEOUT_SECONDS:45}
    embedding:
      enabled: ${SEAL_AI_EMBEDDING_ENABLED:true}
      base-url: ${SEAL_AI_EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${SEAL_AI_EMBEDDING_API_KEY:${SEAL_AI_CHAT_API_KEY:}}
      model: ${SEAL_AI_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${SEAL_AI_EMBEDDING_DIMENSION:1536}
      timeout-seconds: ${SEAL_AI_EMBEDDING_TIMEOUT_SECONDS:45}
      min-score: ${SEAL_AI_EMBEDDING_MIN_SCORE:0.55}
      pgvector-enabled: ${SEAL_AI_PGVECTOR_ENABLED:true}
    rag:
      max-chunks: ${SEAL_AI_RAG_MAX_CHUNKS:5}
      fallback-keyword-chunks: ${SEAL_AI_RAG_FALLBACK_KEYWORD_CHUNKS:3}
    guardrail:
      strict-for-all-roles: ${SEAL_AI_GUARDRAIL_STRICT_FOR_ALL_ROLES:true}
      restrict-to-project-scope: ${SEAL_AI_RESTRICT_TO_PROJECT_SCOPE:true}
      disclaimer: ${SEAL_AI_DISCLAIMER:SEAL Assistant can explain system usage, translate Vietnamese/English, and guide debugging, but it will not write hackathon solution code for participants.}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  packages-to-scan: com.t7.seal.controller
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  avatar-folder: seal/users/avatars
  avatar-max-size-mb: 3
  banner-folder: seal/events/banners
  banner-max-size-mb: 5
