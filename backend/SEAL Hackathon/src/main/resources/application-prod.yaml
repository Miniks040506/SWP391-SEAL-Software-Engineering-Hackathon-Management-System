# src/main/resources/application-prod.yml

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  integrations:
    cookie-secure: ${PROVIDER_OAUTH_COOKIE_SECURE:true}

logging:
  level:
    root: WARN
    com.seal.hackathon: INFO
    org.hibernate.SQL: WARN
